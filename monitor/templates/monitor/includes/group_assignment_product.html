<label class="assignment-product" data-assignment-item data-product-id="{{ product.pk }}" data-search="{{ product.name|lower }} {{ product.asin|lower }}">
  <input type="checkbox" data-assignment-select>
  <span class="catalog-image"><span>{{ product.name|slice:":2"|upper }}</span>{% if product.image_url %}<img src="{{ product.image_url }}" alt="" loading="lazy" onerror="this.remove()">{% endif %}</span>
  <span class="assignment-product-copy"><strong>{{ product.name }}</strong><code>{{ product.asin }}</code><small>{% if product.is_active %}<span class="status ready">Activo</span>{% else %}<span class="status neutral">Inactivo</span>{% endif %}</small></span>
</label>
